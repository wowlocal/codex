<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCP App sandbox</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:transparent}</style>
</head>
<body>
  <script>
    const config = __CODEX_CONFIG__;
    const ownOrigin = window.location.origin;
    if (window.self === window.top) throw new Error("MCP App sandbox must be embedded");
    try {
      void window.top.document;
      throw new Error("MCP App sandbox is not origin-isolated");
    } catch (error) {
      if (error instanceof Error && error.message === "MCP App sandbox is not origin-isolated") throw error;
    }

    const app = document.createElement("iframe");
    app.title = "MCP App content";
    app.referrerPolicy = "no-referrer";
    app.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
    document.body.appendChild(app);

    function buildAllowAttribute(permissions) {
      if (!permissions || typeof permissions !== "object") return "";
      const values = [];
      if (permissions.camera) values.push("camera");
      if (permissions.microphone) values.push("microphone");
      if (permissions.geolocation) values.push("geolocation");
      if (permissions.clipboardWrite) values.push("clipboard-write");
      return values.join("; ");
    }

    window.addEventListener("message", event => {
      if (event.source === parent) {
        if (event.origin !== config.hostOrigin || event.data?.channel !== config.channel) return;
        const message = event.data.message;
        if (message?.method === "ui/notifications/sandbox-resource-ready") {
          const params = message.params || {};
          if (typeof params.sandbox === "string") app.setAttribute("sandbox", params.sandbox);
          const allow = buildAllowAttribute(params.permissions);
          if (allow) app.setAttribute("allow", allow);
          if (typeof params.html !== "string") return;
          const doc = app.contentDocument || app.contentWindow?.document;
          if (!doc) throw new Error("MCP App content document is unavailable");
          doc.open();
          doc.write(params.html);
          doc.close();
          return;
        }
        app.contentWindow?.postMessage(message, "*");
        return;
      }
      if (event.source === app.contentWindow) {
        if (event.origin !== ownOrigin) {
          console.warn("[Codex MCP Apps] rejected message from unexpected View origin", event.origin);
          return;
        }
        parent.postMessage(
          { channel: config.channel, message: event.data },
          config.hostOrigin,
        );
      }
    });

    parent.postMessage(
      {
        channel: config.channel,
        message: {
          jsonrpc: "2.0",
          method: "ui/notifications/sandbox-proxy-ready",
          params: {},
        },
      },
      config.hostOrigin,
    );
  </script>
</body>
</html>
